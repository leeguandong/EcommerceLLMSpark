# LlamaFactory configuration for the published Spark-X2.5-4B LoRA run.
# Adjust model_name_or_path, dataset_dir and output_dir for your environment.
model_name_or_path: models/Spark-X2.5-4B
trust_remote_code: true
stage: sft
do_train: true
do_eval: true
finetuning_type: lora
lora_rank: 16
lora_alpha: 32
lora_dropout: 0.05
lora_target: q_k_v_proj,g_proj,out_proj,gate_proj,up_proj,down_proj
dataset_dir: data
dataset: train
eval_dataset: validation
template: spark
enable_thinking: false
cutoff_len: 2560
train_on_prompt: false
packing: false
output_dir: outputs/spark4b_lora_v1
overwrite_output_dir: false
logging_steps: 5
save_strategy: steps
save_steps: 100
eval_strategy: steps
eval_steps: 100
save_total_limit: 3
save_only_model: false
load_best_model_at_end: true
metric_for_best_model: eval_loss
greater_is_better: false
plot_loss: true
report_to: none
per_device_train_batch_size: 2
gradient_accumulation_steps: 4
per_device_eval_batch_size: 2
learning_rate: 0.00005
num_train_epochs: 1.0
lr_scheduler_type: cosine
warmup_ratio: 0.03
optim: adamw_torch
weight_decay: 0.01
max_grad_norm: 1.0
bf16: true
gradient_checkpointing: true
ddp_find_unused_parameters: false
seed: 20260907
data_seed: 20260907
